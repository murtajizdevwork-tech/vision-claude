openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Vision Preparation Evening Coaching - API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: courses
    description: Courses
  - name: faculty
    description: Faculty
  - name: testimonials
    description: Testimonials
  - name: blogs
    description: Blog posts
  - name: events
    description: Events
  - name: gallery
    description: Gallery
  - name: results
    description: Results
  - name: faqs
    description: FAQs
  - name: stats
    description: Site statistics
  - name: forms
    description: Form submissions
  - name: admin
    description: Admin CMS
  - name: messages
    description: Contact messages

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/register:
