components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── AUTH ─────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          
        password:
          type: string
        role:
          type: string
          enum: [admin, editor, student]

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, student]
        createdAt:
          type: string
          format: date-time

    # ─── STATS ────────────────────────────────────────
    SiteStats:
      type: object
      required: [totalStudents, successRate, totalCourses, yearsExperience, topPositions, totalFaculty]
      properties:
        totalStudents:
          type: integer
        successRate:
          type: integer
        totalCourses:
          type: integer
        yearsExperience:
          type: integer
        topPositions:
          type: integer
        totalFaculty:
          type: integer

    # ─── COURSES ──────────────────────────────────────
    Course:
      type: object
      required: [id, title, slug, category, description, duration, fee, featured]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        description:
          type: string
        overview:
          type: ["string", "null"]
        subjects:
          type: ["string", "null"]
        duration:
          type: string
        fee:
          type: string
        schedule:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        featured:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time

    CourseInput:
      type: object
